## Testing Approach

- Think like a real user experiencing the application
- Think like a tester actively trying to break the system
- Identify missing validations and validation gaps
- Verify features behave correctly in both normal and abnormal situations
- Confirm error messages are clear and helpful
- Verify protected pages and endpoints cannot be accessed without proper permissions
